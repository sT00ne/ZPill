name: Build ZPill APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Android source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/platform/video_player.dart")
          source = path.read_text(encoding="utf-8")

          block = (
              "  if (Platform.operatingSystem == 'ohos') {\n"
              "    return OhosView(\n"
              "      viewType: 'zpill/video-view',\n"
              "      onPlatformViewCreated: onCreated,\n"
              "    );\n"
              "  }\n"
          )

          if source.count(block) != 1:
              raise SystemExit(
                  "没有找到唯一的 OhosView 代码块，请检查源码是否已更新"
              )

          path.write_text(source.replace(block, "", 1), encoding="utf-8")
          PY

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zpill-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
